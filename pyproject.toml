[project]
name = "sandpit"
version = "0.1.0"
description = "Sandpit: multi-agent 3D reinforcement-learning environments in Godot 4 with pixel observations, and PPO, self-play and world-model baselines."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "gymnasium>=1.0",
    "tensorboard>=2.17",
    "tyro>=0.8",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "imageio[ffmpeg]>=2.35",
    "pillow>=10.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/sandpit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
